[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-tool"
version = "0.1.0"
description = "Local-first autonomous visual information explorer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "aiofiles>=23.2",
    "aiosqlite>=0.20",
    "pillow>=10.3",
    "imagehash>=4.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
research-tool = "research_tool.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
